name: Postman CI
on: [push]

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Postman collection Smoke Test
        uses: postmanlabs/postman-cli-action@v1
        with:
          api-key: ${{ secrets.POSTMAN_API_KEY }}
          command: >-
            collection run "${{ vars.COLLECTION_ID }}"
            -e "${{ vars.ENV_ID }}"
            -i "${{ vars.SMOKE_TEST_FOLDER }}"
            --reporters junit,cli

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-junit-report-${{ github.run_number }}
          path: postman-cli-report.junit.xml
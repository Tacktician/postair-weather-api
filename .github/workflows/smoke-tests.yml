name: Postman - Smoke Tests
on:
  push:
    branches:
      - main

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Authenticate Postman CLI
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Run Postman collection Smoke Test
        run: |
          postman collection run ${{ vars.COLLECTION_ID }} \
            -e ${{vars.ENV_ID }} \
            -i ${{ vars.SMOKE_TEST_FOLDER }} \
            --reporters junit,cli

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-junit-report-${{ github.run_number }}
          path: postman-cli-reports/*.xml
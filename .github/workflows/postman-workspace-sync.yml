name: Postman Workspace Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

# A push to the cloud workspace is not safe to run concurrently with itself;
# let an in-flight sync finish before the next merge's sync starts.
concurrency:
  group: postman-workspace-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Pin the Postman CLI to 1.38.1. Starting in 1.41.0 the sync-planner attempts to
      # push local (script-based) mocks, but the mockService backing that isn't GA yet,
      # so the push fails with:
      #   "Mock push is not configured: pass mockService to CompositePushStrategy".
      # 1.38.1 predates that change and skips the local mock cleanly. Revert to the
      # unpinned latest install once mock push GAs upstream:
      #   run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Install Postman CLI (pinned 1.38.1)
        run: |
          curl -sSL "https://dl-cli.pstmn.io/install/linux64.sh" \
            | sed 's#/download/latest/#/download/version/1.38.1/#' | sh
          postman --version

      - name: Authenticate Postman CLI
        run: postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Validate workspace
        run: postman workspace prepare

      - name: Publish to Postman Cloud
        run: postman workspace push -y

# Template only — do NOT commit the real secret.
# scripts/deploy.sh creates this secret from the WEATHER_API_KEY env var:
#
#   kubectl -n postair create secret generic weather-api-secret \
#     --from-literal=WEATHER_API_KEY="$WEATHER_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# To apply manually instead, copy this file to secret.yaml, set a real value,
# and `kubectl apply -f secret.yaml` (secret.yaml is gitignored).
apiVersion: v1
kind: Secret
metadata:
  name: weather-api-secret
  namespace: postair
type: Opaque
stringData:
  WEATHER_API_KEY: "replace-me"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postair-weather-api
  namespace: postair
  labels:
    app.kubernetes.io/name: postair-weather-api
    app.kubernetes.io/part-of: postair-weather-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: postair-weather-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postair-weather-api
        app.kubernetes.io/part-of: postair-weather-api
    spec:
      containers:
        - name: postair-weather-api
          # Replaced by scripts/deploy.sh with the ECR image ref (repo:tag).
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-api-secret
                  key: WEATHER_API_KEY
            # Postman Insights workspace mode: the DaemonSet agent reads these from this
            # pod's env and routes its captured traffic to the matching API Catalog
            # workspace/system environment. UUIDs from .postman/resources.yaml.
            - name: POSTMAN_INSIGHTS_WORKSPACE_ID
              value: "fce449ac-694a-4741-a66f-72ac535b3a8d"
            - name: POSTMAN_INSIGHTS_SYSTEM_ENV
              value: "482ed6eb-8c76-4e77-adba-d51b44ee31d5"
            # The agent also requires the Postman API key on each target pod to authenticate
            # that pod's data. optional:true so the workload still starts when the agent is
            # not in use (secret absent). Created by deploy.sh when POSTMAN_INSIGHTS_API_KEY
            # is set.
            - name: POSTMAN_INSIGHTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: postman-agent-secrets
                  key: postman-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

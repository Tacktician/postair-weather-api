$kind: http-request
description: Returns a list of turbulence reports
url: "{{baseUrl}}/turbulence"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
examples: ./.resources/Retrieve turbulence report.resources/examples
order: 1000

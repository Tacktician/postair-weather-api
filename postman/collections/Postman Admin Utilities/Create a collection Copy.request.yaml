$kind: http-request
description: |-
  Creates a collection. For a complete list of properties and information, see the [Postman Collection Format documentation](https://schema.postman.com/collection/json/v2.1.0/draft-07/docs/index.html).

  **Note:**

  - This request uses example values in the request body for context when creating a collection. For additional ways to create a collection, see the collection's examples.
      
  - If you do not include the `workspace` query parameter, the system creates the collection in the oldest personal Internal workspace you own.
url: "{{baseUrl}}/collections?workspace={{workspaceId}}"
method: POST
queryParams:
  - key: workspace
    value: "{{workspaceId}}"
    description: |-
      A workspace ID in which to create the collection.

      If you do not include this parameter, the system creates the collection in the oldest personal Internal workspace you own.
body:
  type: json
  content: |-
    {
      "collection": {
        "info": {
          "name": "PostAir — Linked Test Suite",
          "description": "Test suite for the PostAir Weather API. Validates METAR reports and turbulence data across all airports. Organized for use with the Collection Runner and Package Library validators.\n\nPrerequisites: PostAir Staging or Production environment active with baseUrl and apiKey configured.",
          "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
        },
        "auth": {
          "type": "apikey",
          "apikey": [
            { "key": "key", "value": "x-api-key", "type": "string" },
            { "key": "value", "value": "{{apiKey}}", "type": "string" },
            { "key": "in", "value": "header", "type": "string" }
          ]
        },
        "item": [
          {
            "name": "Airports",
            "description": "Fetches airport data and extracts ICAO codes for downstream requests.",
            "item": [
              {
                "name": "Fetch all airport codes",
                "request": {
                  "method": "GET",
                  "url": {
                    "raw": "{{baseUrl}}/airports?countryName=United States",
                    "host": ["{{baseUrl}}"],
                    "path": ["airports"],
                    "query": [
                      { "key": "countryName", "value": "United States" }
                    ]
                  }
                }
              }
            ]
          },
          {
            "name": "METAR Reports",
            "description": "Validates METAR data for each airport using Package Library validators.",
            "item": [
              {
                "name": "Get METAR — dynamic airport",
                "request": {
                  "method": "GET",
                  "url": {
                    "raw": "{{baseUrl}}/metars/{{airportCode}}",
                    "host": ["{{baseUrl}}"],
                    "path": ["metars", "{{airportCode}}"]
                  }
                }
              }
            ]
          },
          {
            "name": "Turbulence",
            "description": "Validates turbulence data for each airport using Package Library validators.",
            "item": [
              {
                "name": "Get turbulence — dynamic airport",
                "request": {
                  "method": "GET",
                  "url": {
                    "raw": "{{baseUrl}}/turbulence/{{airportCode}}",
                    "host": ["{{baseUrl}}"],
                    "path": ["turbulence", "{{airportCode}}"]
                  }
                }
              }
            ]
          }
        ]
      }
    }
scripts:
  - type: afterResponse
    code: |-
      const collection = pm.response.json().collection;
      pm.collectionVariables.set("collectionId", collection.id);
    language: text/javascript
examples: ./.resources/Create a collection Copy.resources/examples
order: 3000
